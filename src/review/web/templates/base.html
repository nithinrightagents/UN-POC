<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EKAP AIQ Review{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --color-brand-primary: #006699;
            --color-brand-primary-hover: #004d73;
            --color-brand-primary-light: #009edb;
            --color-brand-primary-subtle: #e0f2fe;
            --color-brand-navy: #0c1e3d;
            --color-brand-navy-surface: #132a54;
            
            --color-bg-canvas: #f8fafc;
            --color-bg-surface: #ffffff;
            --color-bg-surface-subtle: #f1f5f9;
            --color-bg-surface-hover: #f8fafc;
            
            --color-text-primary: #0f172a;
            --color-text-secondary: #334155;
            --color-text-muted: #64748b;
            --color-text-inverse: #ffffff;
            --color-text-inverse-muted: #94a3b8;
            
            --color-border-subtle: #e2e8f0;
            --color-border-default: #cbd5e1;
            --color-border-strong: #94a3b8;
            --color-border-focus: #006699;

            --color-success-bg: #ecfdf5;
            --color-success-text: #065f46;
            --color-success-border: #a7f3d0;
            
            --color-warning-bg: #fffbeb;
            --color-warning-text: #92400e;
            --color-warning-border: #fde68a;
            
            --color-danger-bg: #fef2f2;
            --color-danger-text: #991b1b;
            --color-danger-border: #fecaca;

            --color-info-bg: #eff6ff;
            --color-info-text: #1e40af;
            --color-info-border: #bfdbfe;

            --shadow-xs: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
            --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07);

            --radius-xs: 4px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;

            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-heading: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
            
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg-canvas);
            color: var(--color-text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: 1rem;
            background: #ffffff;
            color: var(--color-brand-primary);
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.08);
            z-index: 9999;
            text-decoration: none;
            border: 2px solid var(--color-brand-primary);
        }
        .skip-link:focus { left: 1rem; outline: none; }

        a {
            color: var(--color-brand-primary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        a:hover {
            color: var(--color-brand-primary-hover);
            text-decoration: underline;
        }

        :focus-visible {
            outline: 2px solid var(--color-brand-primary);
            outline-offset: 2px;
        }

        header.site-header {
            background-color: var(--color-brand-navy);
            color: var(--color-text-inverse);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.875rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .brand-container {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            text-decoration: none;
            color: var(--color-text-inverse);
        }
        .brand-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--color-brand-primary-light), var(--color-brand-primary));
            border-radius: var(--radius-md);
            color: #ffffff;
            font-weight: 800;
            font-size: 1.125rem;
        }
        .brand-text {
            display: flex;
            flex-direction: column;
        }
        .brand-title {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.125rem;
            color: #ffffff;
            line-height: 1.2;
        }
        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--color-text-inverse-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        nav.site-nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        nav.site-nav a {
            color: #cbd5e1;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 0.875rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            transition: all var(--transition-fast);
        }
        nav.site-nav a:hover {
            color: #ffffff;
            background-color: var(--color-brand-navy-surface);
        }

        main.main-content {
            max-width: 1080px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-heading);
            color: var(--color-text-primary);
            line-height: 1.3;
            letter-spacing: -0.02em;
            font-weight: 700;
        }
        h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1.35rem; margin-bottom: 0.5rem; }
        h3 { font-size: 1.15rem; margin-bottom: 0.375rem; }

        .card {
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-xs);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.25rem 0.625rem;
            border-radius: var(--radius-full);
            font-size: 0.775rem;
            font-weight: 600;
            line-height: 1.2;
            border: 1px solid transparent;
        }
        .badge--verified, .badge--pass {
            background-color: var(--color-success-bg);
            color: var(--color-success-text);
            border-color: var(--color-success-border);
        }
        .badge--unverified, .badge--fail {
            background-color: var(--color-danger-bg);
            color: var(--color-danger-text);
            border-color: var(--color-danger-border);
        }
        .badge--stale, .badge--lang-best-effort {
            background-color: var(--color-warning-bg);
            color: var(--color-warning-text);
            border-color: var(--color-warning-border);
        }
        .badge--source {
            background-color: var(--color-info-bg);
            color: var(--color-info-text);
            border-color: var(--color-info-border);
        }

        .confidence {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--color-text-primary);
        }
        .confidence--low {
            color: var(--color-danger-text);
        }

        table.detail__table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.875rem;
            font-size: 0.875rem;
        }
        table.detail__table th, table.detail__table td {
            text-align: left;
            padding: 0.625rem 0.75rem;
            border-bottom: 1px solid var(--color-border-subtle);
        }
        table.detail__table th {
            background-color: var(--color-bg-surface-subtle);
            color: var(--color-text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .evidence {
            border-left: 4px solid var(--color-brand-primary-light);
            background-color: #f8faff;
            padding: 1.25rem;
            border-radius: var(--radius-sm);
            margin: 1.25rem 0;
            border: 1px solid #d0e1fd;
            border-left-width: 4px;
        }
        .evidence--missing {
            border-left-color: #dc2626;
            background-color: var(--color-danger-bg);
            border-color: var(--color-danger-border);
            border-left-width: 4px;
            color: var(--color-danger-text);
        }
        .evidence__capture {
            max-width: 100%;
            border: 1px solid var(--color-border-default);
            border-radius: var(--radius-sm);
            margin: 0.75rem 0;
            box-shadow: var(--shadow-sm);
        }
        .evidence__meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        .evidence__element-text {
            font-style: italic;
            color: var(--color-text-primary);
            margin: 0.5rem 0;
        }
        .evidence__translation {
            color: var(--color-text-secondary);
            margin-bottom: 0.5rem;
        }
        .evidence__selector code {
            font-family: monospace;
            font-size: 0.825rem;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 0.15rem 0.4rem;
            border-radius: var(--radius-xs);
        }
        .evidence__timestamp {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-top: 0.5rem;
        }

        .status--unlocked { color: var(--color-success-text); font-weight: 600; }
        .status--locked { color: var(--color-warning-text); font-weight: 600; }

        form.actions {
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-top: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-primary);
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 0.5625rem 0.75rem;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--color-text-primary);
            background-color: var(--color-bg-surface);
            border: 1px solid var(--color-border-default);
            border-radius: var(--radius-sm);
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--color-brand-primary);
            box-shadow: 0 0 0 3px var(--color-brand-primary-subtle);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5625rem 1.125rem;
            border-radius: var(--radius-sm);
            font-family: var(--font-sans);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--color-border-default);
            background-color: var(--color-bg-surface);
            color: var(--color-text-primary);
            transition: all var(--transition-fast);
        }
        button:hover { background-color: var(--color-bg-surface-subtle); }
        button.primary {
            background-color: var(--color-brand-primary);
            color: #ffffff;
            border-color: var(--color-brand-primary);
        }
        button.primary:hover {
            background-color: var(--color-brand-primary-hover);
        }
        button.danger {
            background-color: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
        }
        button.danger:hover {
            background-color: #b91c1c;
        }

        details.detail {
            background-color: var(--color-bg-surface-subtle);
            border: 1px solid var(--color-border-subtle);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            margin-top: 1rem;
        }
        details.detail summary {
            font-weight: 600;
            cursor: pointer;
            color: var(--color-brand-primary);
        }
        details.detail summary:hover {
            text-decoration: underline;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--color-text-muted);
            margin-bottom: 1rem;
        }

        footer.site-footer {
            background-color: #ffffff;
            border-top: 1px solid var(--color-border-subtle);
            color: var(--color-text-muted);
            padding: 1.5rem;
            margin-top: auto;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    
    <header class="site-header" role="banner">
        <div class="header-inner">
            <a class="brand-container" href="/" aria-label="EKAP Home">
                <div class="brand-logo-badge" aria-hidden="true">UN</div>
                <div class="brand-text">
                    <span class="brand-title">EKAP AIQ</span>
                    <span class="brand-subtitle">Automated Assessment Review</span>
                </div>
            </a>
            <nav class="site-nav" role="navigation" aria-label="Main Navigation">
                <a href="/">Portal Home</a>
                <a href="/admin">Admin</a>
                <a href="/assessor">Assessor</a>
                <a href="/public">Public Knowledge Base</a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="main-content" role="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer" role="contentinfo">
        <div>EKAP AIQ Review &middot; United Nations Public Administration &amp; E-Government Branch</div>
    </footer>
</body>
</html>
