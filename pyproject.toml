[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ekap-aiq"
version = "0.1.0"
description = "EKAP AIQ - AI-assisted portal assessment proof of concept"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "google-adk>=1.35.0",
    "google-genai>=1.70.0",
    "playwright>=1.45.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "langsmith>=0.1.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
aiq = "cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure-logic tests, no I/O",
    "contract: agent I/O schema tests",
    "integration: pipeline tests against fixtures",
    "independence: assertions that make the method defensible",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
